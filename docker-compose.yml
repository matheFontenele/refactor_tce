services:
  # FastAPI backend for SQL Studio and analytics
  # NOTE: host port 9001 (not 8000/9000 - occupied by other projects)
  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile.api
    ports:
      - "9001:8000"
    environment:
      - DUCKDB_PATH=/data/tce_analysis.duckdb
      - MEMORY_LIMIT=1536
      - ENDPOINTS_FILE=/config/endpoints.json
      - MUNICIPIOS_FILE=/config/municipios.json
      - PARQUET_DIR=/parquet
      - CACHE_PARQUET_DIR=/cache
      - TCE_FETCH_BUDGET_SECONDS=120
      - TCE_FETCH_MAX_RECORTES=24
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001,http://localhost:3000,http://172.16.0.200:3001}
      # Assistente IA: LLM local (tce-ollama-local na rede do projeto original)
      - OLLAMA_BASE_URL=http://tce-ollama-local:11434
      - OLLAMA_MODEL=qwen3:4b
      - AI_CATEGORIES=notas_empenho,notas_fiscais,liquidacoes
    networks:
      - default
      - ollama
    volumes:
      - ./data:/data:ro
      # Dataset real do TCE (read-only). Defina PARQUET_SOURCE no .env.
      # Default ./data = sem parquets → Pesquisa cai no seed automaticamente.
      - ${PARQUET_SOURCE:-./data}:/parquet:ro
      # Cache gravável: recortes baixados sob demanda da API TCE (Spec 2.1)
      - ./data/cache:/cache
      - ./endpoints.json:/config/endpoints.json:ro
      - ./municipios.json:/config/municipios.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Next.js frontend (SQL Studio)
  # NOTE: host port 3001 (not 3000 - occupied by controle-interno-web-react-app)
  frontend:
    build:
      context: ./src/app
      dockerfile: Dockerfile.nextjs
    ports:
      - "3001:3000"
    environment:
      - API_URL=http://api:8000
      # Sem valor fixo: o frontend usa o mesmo host acessado pelo navegador.
      # Pode ser sobrescrito por DNS/reverse proxy via .env.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    depends_on:
      api:
        condition: service_started

  # Streamlit frontend (temporary during migration)
  # NOTE: host port 8502 (not 8501 - occupied by tce_app)
  streamlit:
    build:
      context: ./src/app
      dockerfile: Dockerfile.streamlit
    ports:
      - "8502:8501"
    environment:
      - DUCKDB_PATH=/data/tce_analysis.duckdb
    volumes:
      - ./data:/data:ro
    profiles:
      - streamlit

  # Ollama LLM for AI Assistant (uses existing tce-ollama-local if running)
  ollama:
    image: ollama/ollama:latest
    container_name: tce-ollama-refactor
    ports:
      - "11435:11434"
    volumes:
      - ollama_models:/root/.ollama:rw
    profiles:
      - ai

networks:
  # Rede do projeto original, onde o tce-ollama-local está conectado.
  # Se o Ollama rodar em outro host, sobrescreva OLLAMA_BASE_URL no .env.
  ollama:
    external: true
    name: ${OLLAMA_NETWORK:-automacao_api_tse_default}

volumes:
  data:
    driver: local
  ollama_models:
    driver: local
